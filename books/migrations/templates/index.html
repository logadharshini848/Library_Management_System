<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #173b57;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        h2 {
            color: #173b57;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        .add-btn {
            background: #173b57;
            color: white;
        }

        .edit-btn {
            background: #f0ad4e;
            color: white;
        }

        .delete-btn {
            background: #d9534f;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #173b57;
            color: white;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .unavailable {
            color: red;
            font-weight: bold;
        }

        #message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Library Management System</h1>
    <p>Manage your library books easily</p>
</header>

<div class="container">

    <div class="card">
        <h2>Add Book</h2>

        <input type="text" id="title" placeholder="Enter book title">
        <input type="text" id="author" placeholder="Enter author name">
        <input type="text" id="isbn" placeholder="Enter ISBN">

        <button class="add-btn" onclick="addBook()">Add Book</button>

        <div id="message"></div>
    </div>

    <div class="card">
        <h2>Book List</h2>

        <input type="text" id="search" placeholder="Search books..." onkeyup="displayBooks()">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Available</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="bookTable">
            </tbody>
        </table>
    </div>

</div>

<script>

const API_URL = "/api/books/";

let books = [];

async function loadBooks() {
    const response = await fetch(API_URL);
    books = await response.json();
    displayBooks();
}

function displayBooks() {

    const table = document.getElementById("bookTable");
    const search = document.getElementById("search").value.toLowerCase();

    table.innerHTML = "";

    books
        .filter(book =>
            book.title.toLowerCase().includes(search) ||
            book.author.toLowerCase().includes(search)
        )
        .forEach(book => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${book.id}</td>
                <td>${book.title}</td>
                <td>${book.author}</td>
                <td>${book.isbn}</td>
                <td>
                    <span class="${book.available ? 'available' : 'unavailable'}">
                        ${book.available ? 'Available' : 'Unavailable'}
                    </span>
                </td>
                <td>
                    <button class="edit-btn" onclick="editBook(${book.id})">
                        Edit
                    </button>

                    <button class="delete-btn" onclick="deleteBook(${book.id})">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);
        });
}

async function addBook() {

    const title = document.getElementById("title").value.trim();
    const author = document.getElementById("author").value.trim();
    const isbn = document.getElementById("isbn").value.trim();

    if (!title || !author || !isbn) {
        showMessage("Please fill all fields.", "red");
        return;
    }

    const response = await fetch(API_URL, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            title: title,
            author: author,
            isbn: isbn,
            available: true
        })
    });

    if (response.ok) {

        showMessage("Book added successfully!", "green");

        document.getElementById("title").value = "";
        document.getElementById("author").value = "";
        document.getElementById("isbn").value = "";

        loadBooks();

    } else {

        showMessage("Could not add book. ISBN may already exist.", "red");
    }
}

async function editBook(id) {

    const book = books.find(b => b.id === id);

    const newTitle = prompt("Enter new title:", book.title);

    if (newTitle === null || newTitle.trim() === "") {
        return;
    }

    const response = await fetch(API_URL + id + "/", {
        method: "PATCH",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            title: newTitle
        })
    });

    if (response.ok) {
        loadBooks();
    }
}

async function deleteBook(id) {

    if (!confirm("Are you sure you want to delete this book?")) {
        return;
    }

    const response = await fetch(API_URL + id + "/", {
        method: "DELETE"
    });

    if (response.ok) {
        loadBooks();
    }
}

function showMessage(text, color) {
    const message = document.getElementById("message");
    message.innerText = text;
    message.style.color = color;
}

loadBooks();

</script>

</body>
</html>
