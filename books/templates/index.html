<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #243b55;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 20px;
            color: #243b55;
        }

        .form-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn {
            background: #243b55;
            color: white;
            margin-top: 15px;
        }

        .add-btn:hover {
            background: #1b2d41;
        }

        .search-box {
            width: 100%;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #243b55;
            color: white;
        }

        .edit-btn {
            background: #f0ad4e;
            color: white;
            margin-right: 5px;
        }

        .delete-btn {
            background: #d9534f;
            color: white;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 700px) {
            .form-group {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Library Management System</h1>
    <p>Manage Books Easily</p>
</header>

<div class="container">

    <!-- Add Book Section -->
    <div class="card">
        <h2>Add New Book</h2>

        <div id="message" class="message"></div>

        <div class="form-group">
            <input type="text" id="title" placeholder="Book Title">
            <input type="text" id="author" placeholder="Author Name">
            <input type="text" id="isbn" placeholder="ISBN">
        </div>

        <button class="add-btn" onclick="addBook()">Add Book</button>
    </div>

    <!-- Books List -->
    <div class="card">
        <h2>Book Records</h2>

        <input
            type="text"
            id="search"
            class="search-box"
            placeholder="🔍 Search by title or author..."
            onkeyup="searchBooks()"
        >

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Available</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="bookTable">
            </tbody>
        </table>
    </div>

</div>

<script>

    const API_URL = "/api/books/";

    let allBooks = [];


    // Load all books
    async function loadBooks() {

        try {

            const response = await fetch(API_URL);

            allBooks = await response.json();

            displayBooks(allBooks);

        } catch (error) {

            showMessage("Unable to load books.", "error");

        }
    }


    // Display books
    function displayBooks(books) {

        const table = document.getElementById("bookTable");

        table.innerHTML = "";

        if (books.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align:center;">
                        No books found
                    </td>
                </tr>
            `;

            return;
        }


        books.forEach(book => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${book.id}</td>

                <td>${book.title}</td>

                <td>${book.author}</td>

                <td>${book.isbn}</td>

                <td>
                    ${book.available ? "Yes" : "No"}
                </td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editBook(${book.id})">
                        Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteBook(${book.id})">
                        Delete
                    </button>

                </td>
            `;

            table.appendChild(row);

        });
    }


    // Add book
    async function addBook() {

        const title =
            document.getElementById("title").value.trim();

        const author =
            document.getElementById("author").value.trim();

        const isbn =
            document.getElementById("isbn").value.trim();


        // Validation
        if (!title || !author || !isbn) {

            showMessage(
                "Please fill all fields.",
                "error"
            );

            return;
        }


        try {

            const response = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    title: title,

                    author: author,

                    isbn: isbn,

                    available: true

                })

            });


            if (response.ok) {

                showMessage(
                    "Book added successfully!",
                    "success"
                );

                document.getElementById("title").value = "";

                document.getElementById("author").value = "";

                document.getElementById("isbn").value = "";

                loadBooks();

            } else {

                const data = await response.json();

                if (data.isbn) {

                    showMessage(
                        "ISBN already exists.",
                        "error"
                    );

                } else {

                    showMessage(
                        "Failed to add book.",
                        "error"
                    );
                }
            }

        } catch (error) {

            showMessage(
                "Server error.",
                "error"
            );

        }
    }


    // Edit book
    async function editBook(id) {

        const book =
            allBooks.find(b => b.id === id);

        if (!book) return;


        const newTitle =
            prompt(
                "Enter new book title:",
                book.title
            );

        if (newTitle === null || newTitle.trim() === "") {

            return;
        }


        try {

            const response = await fetch(
                `${API_URL}${id}/`,
                {

                    method: "PATCH",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        title: newTitle

                    })

                }
            );


            if (response.ok) {

                showMessage(
                    "Book updated successfully!",
                    "success"
                );

                loadBooks();

            } else {

                showMessage(
                    "Failed to update book.",
                    "error"
                );

            }

        } catch (error) {

            showMessage(
                "Server error.",
                "error"
            );

        }
    }


    // Delete book
    async function deleteBook(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this book?"
            );

        if (!confirmDelete) return;


        try {

            const response = await fetch(
                `${API_URL}${id}/`,
                {
                    method: "DELETE"
                }
            );


            if (response.ok) {

                showMessage(
                    "Book deleted successfully!",
                    "success"
                );

                loadBooks();

            } else {

                showMessage(
                    "Failed to delete book.",
                    "error"
                );

            }

        } catch (error) {

            showMessage(
                "Server error.",
                "error"
            );

        }
    }


    // Search books
    function searchBooks() {

        const searchText =
            document
                .getElementById("search")
                .value
                .toLowerCase();


        const filteredBooks =
            allBooks.filter(book =>

                book.title
                    .toLowerCase()
                    .includes(searchText)

                ||

                book.author
                    .toLowerCase()
                    .includes(searchText)

                ||

                book.isbn
                    .toLowerCase()
                    .includes(searchText)

            );


        displayBooks(filteredBooks);
    }


    // Show message
    function showMessage(text, type) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display = "block";


        setTimeout(() => {

            message.style.display = "none";

        }, 3000);

    }


    // Load books when page opens
    loadBooks();

</script>

</body>
</html>
